[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-history"
version = "2.0.0"
description = "Local-first AI chat history manager and session switcher for Claude, Cursor, Gemini, Codex, Warp, and more"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ai-history contributors"}
]
keywords = ["ai", "chat-history", "session-management", "claude", "gemini", "cursor", "codex", "warp", "opencode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "flask>=3.0.0,<4.0.0",
    "markdown>=3.5.0,<4.0.0",
    "bleach>=6.1.0,<7.0.0",
    "webencodings>=0.5.1",

    "google-generativeai>=0.3.0,<1.0.0",
    "google-auth>=2.0.0,<3.0.0",
]

[project.scripts]
ai-history = "ai_history_cli:main"
ai-session = "ai_session_cli:main"
ai-history-web = "ai_history_web_new:main"
ai-history-mcp = "ai_history_mcp_new:main_sync"
ai-history-web-probe = "ai_history.interfaces.live_probe:main"

[tool.setuptools]
py-modules = ["ai_history_cli", "ai_session_cli", "ai_history_web_new", "ai_history_mcp_new"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_history*"]
