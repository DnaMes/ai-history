[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-history"
dynamic = ["version"]
description = "Local-first AI chat history manager and session switcher for Claude, Cursor, Gemini, Codex, Warp, and more"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "André Semek", email = "erdna1982@gmail.com"}
]
keywords = ["ai", "chat-history", "session-management", "claude", "gemini", "cursor", "codex", "warp", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

dependencies = [
    "flask>=3.0.0,<4.0.0",
    "markdown>=3.5.0,<4.0.0",
    "nh3>=0.2.0",

    "google-generativeai>=0.3.0,<1.0.0",
    "google-auth>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
watch = ["watchdog>=3.0"]
# Local semantic memory search — a small CPU-only ONNX model, no torch.
semantic = ["fastembed>=0.3"]

[project.urls]
Homepage = "https://github.com/DnaMes/ai-history"
Repository = "https://github.com/DnaMes/ai-history"
Issues = "https://github.com/DnaMes/ai-history/issues"

[project.scripts]
ai-history = "ai_history_cli:main"
ai-session = "ai_session_cli:main"
ai-history-web = "ai_history.cli.web:main"
ai-history-mcp = "ai_history.cli.mcp:main_sync"
ai-history-web-probe = "ai_history.interfaces.live_probe:main"

[tool.setuptools]
py-modules = ["ai_history_cli", "ai_session_cli"]

[tool.setuptools.dynamic]
# Single source of truth — the version lives in ai_history/__init__.py.
version = {attr = "ai_history.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_history*"]

[tool.setuptools.package-data]
# Vendored web assets (Tailwind, highlight.js) must ship in the wheel.
"ai_history.interfaces" = ["static/*.js", "static/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E203"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".claude"]
skips = ["B101"]  # assert statements ok in tests

[tool.ruff.lint.per-file-ignores]
# Embedded JS/CSS strings legitimately contain blank-line whitespace
"ai_history/utils/themes.py" = ["W293"]
# Lazy imports gated on optional dependency availability
"ai_history/interfaces/mcp.py" = ["E402"]
"ai_history/titles/generator.py" = ["E402"]
# Pre-existing unused-locals slated for separate cleanup
"ai_history/extractors/claude.py" = ["F841"]
"ai_session_cli.py" = ["F841"]

[tool.pytest.ini_options]
addopts = "--cov=ai_history --cov-config=pyproject.toml --cov-report=term-missing -q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ai_history"]
omit = [
    "ai_history/llm/*",
    "ai_history/titles/*",
    "ai_history/watcher.py",
    "ai_history/cli/mcp.py",
    "ai_history/cli/web.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportUnusedParameter = false
