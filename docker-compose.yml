---
services:
  app:
    build: .
    container_name: ai-history-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Mount config directories (ReadOnly)
      - ${HOME}/.claude:/home/ai/.claude:ro
      - ${HOME}/.gemini:/home/ai/.gemini:ro
      - ${HOME}/.codex:/home/ai/.codex:ro
      - ${HOME}/.config/Cursor:/home/ai/.config/Cursor:ro
      - ${HOME}/.config/Code:/home/ai/.config/Code:ro
      - ${HOME}/.local/state/warp-terminal:/home/ai/.local/state/warp-terminal:ro
      - ${HOME}/.local/share/opencode/storage:/home/ai/.local/share/opencode/storage:ro
      - ${HOME}/.local/share/opencode:/home/ai/.local/share/opencode:ro
      - ${HOME}/.copilot:/home/ai/.copilot:ro
      # Mount output directory (ReadWrite)
      - ${HOME}/.ai-history:/home/ai/.ai-history
    environment:
      - HOME=/home/ai
      - AI_HISTORY_RATE_LIMIT_ENABLED=${AI_HISTORY_RATE_LIMIT_ENABLED:-true}
      - AI_HISTORY_RATE_LIMIT_WINDOW_SECONDS=${AI_HISTORY_RATE_LIMIT_WINDOW_SECONDS:-60}
      - AI_HISTORY_RATE_LIMIT_MAX_API_REQUESTS=${AI_HISTORY_RATE_LIMIT_MAX_API_REQUESTS:-240}
      - AI_HISTORY_RATE_LIMIT_SEARCH_PER_WINDOW=${AI_HISTORY_RATE_LIMIT_SEARCH_PER_WINDOW:-180}
      - AI_HISTORY_RATE_LIMIT_AUDIT_PER_WINDOW=${AI_HISTORY_RATE_LIMIT_AUDIT_PER_WINDOW:-20}
      - AI_HISTORY_RATE_LIMIT_RELOAD_PER_WINDOW=${AI_HISTORY_RATE_LIMIT_RELOAD_PER_WINDOW:-12}
      - AI_HISTORY_JSON_REQUEST_LOGS=${AI_HISTORY_JSON_REQUEST_LOGS:-false}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
