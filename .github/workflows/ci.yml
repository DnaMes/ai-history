name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install black isort flake8 mypy bandit

      - name: black
        run: black --check --line-length=100 ai_history/ tests/

      - name: isort
        run: isort --check-only --profile black --line-length=100 ai_history/ tests/

      - name: flake8
        run: flake8 ai_history/ --max-line-length=100 --ignore=E501,W503,E203

      - name: mypy
        run: mypy ai_history/ --ignore-missing-imports

      - name: bandit
        run: bandit -r ai_history/ -ll
